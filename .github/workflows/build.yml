name: Build Frameless_Ai
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Frameless_Ai_source.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease --no-daemon
        working-directory: Frameless_Ai
      - run: cp app/build/outputs/apk/release/app-release.apk Frameless_Ai.apk
        working-directory: Frameless_Ai
      - uses: actions/upload-artifact@v4
        with:
          name: Frameless_Ai
          path: Frameless_Ai/Frameless_Ai.apk
